<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lesson 1 Lab: How Computers Actually Work</title>
<style>
:root{--bg:#f1f4f8;--card:#fff;--ink:#16202e;--mut:#5a6b80;--line:#d2dae5;--acc:#2456d6;--accInk:#fff;--ok:#1b8a4b;--okBg:#dff3e6;--bad:#c23a2e;--badBg:#fbe3e0;--code:#0f1b2d;--codeInk:#d7e6ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1420;--card:#16202f;--ink:#e6edf7;--mut:#9aabc2;--line:#2a3a50;--acc:#6f9bff;--accInk:#08183d;--ok:#5fd28a;--okBg:#173a28;--bad:#ff8a7d;--badBg:#3d1f1b;--code:#0a101a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1420;--card:#16202f;--ink:#e6edf7;--mut:#9aabc2;--line:#2a3a50;--acc:#6f9bff;--accInk:#08183d;--ok:#5fd28a;--okBg:#173a28;--bad:#ff8a7d;--badBg:#3d1f1b;--code:#0a101a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 "Trebuchet MS",Verdana,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:27px;line-height:1.15;margin:8px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:14px}
.tag{display:inline-block;font-size:13px;color:var(--acc);font-weight:bold;margin-bottom:6px}
.q{font-size:19px;font-weight:bold;margin:4px 0 12px}
button,input{font:inherit}
.opt,.btn{display:block;width:100%;text-align:left;padding:13px;margin:8px 0;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;cursor:pointer;min-height:50px}
.btn{background:var(--acc);color:var(--accInk);border-color:var(--acc);text-align:center;font-weight:bold;text-decoration:none}
.btn.alt{background:transparent;color:var(--acc)}
.ok{background:var(--okBg)!important;border-color:var(--ok)!important}
.no{background:var(--badBg)!important;border-color:var(--bad)!important}
.fb{margin-top:12px;padding:12px;border-radius:10px;font-size:16px}
pre{background:var(--code);color:var(--codeInk);padding:12px;border-radius:10px;overflow-x:auto;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;margin:0 0 12px}
input[type=text]{width:100%;padding:14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.row{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}
.row span{flex:1;min-width:140px;font-weight:bold}
.row button{width:auto;margin:0;padding:10px 12px;min-height:44px;text-align:center}
.bits{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:8px 0}
.bits div{text-align:center;font-size:12px;color:var(--mut)}
.bits button{width:100%;margin:0;padding:12px 0;text-align:center;font-size:20px;font-weight:bold;min-height:52px}
.bits button.on{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.read{font-size:24px;font-weight:bold;text-align:center;margin:10px 0}
.big{font-size:56px;font-weight:bold;line-height:1;margin:6px 0}
.miss{border-top:1px solid var(--line);padding:10px 0;font-size:15px}
.num{display:inline-block;min-width:26px;height:26px;border-radius:13px;background:var(--acc);color:var(--accInk);text-align:center;margin-right:8px;font-size:15px;line-height:26px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main id="app"></main>
<script>
const Q=[
{t:'mc',s:'Hardware',q:'In the kitchen analogy, which part is the kitchen counter?',o:['CPU','RAM','Storage','I/O'],a:1,e:'RAM holds what the CPU is working on right now. It is fast, but cleared when you are done.'},
{t:'mc',s:'Hardware',q:'Which part executes instructions: the actual "thinking"?',o:['CPU','Bus','SSD','Monitor'],a:0,e:'The CPU is the chef. It runs instructions one at a time.'},
{t:'tf',s:'Hardware',q:'RAM keeps your data even when the computer is switched off.',a:false,e:'RAM is cleared on restart. Storage keeps data permanently.'},
{t:'mc',s:'Hardware',q:'You restart your computer. Why does your saved .py file still exist?',o:['It lives in RAM','It lives in storage','It lives in the CPU','It lives in the bus'],a:1,e:'Files live in storage. They are only loaded into RAM while the program runs.'},
{t:'mc',s:'Hardware',q:'What carries data between the CPU, RAM and storage?',o:['A bus','A bit','A thread','A reference'],a:0,e:'A bus is the set of pathways between the components.'},
{t:'sort',s:'Hardware',q:'Is each one temporary or permanent?',c:['Temporary','Permanent'],i:[['RAM',0],['SSD',1],['A saved file',1],['Variables while running',0],['Hard disk',1],['An unsaved document',0]],e:'RAM is temporary. Storage is permanent.'},
{t:'bin',s:'Binary lab',q:'Tap the bits to build the number 65. This is the letter A.',n:65,e:'64 + 1 = 65. Bits 64 and 1 are on: 01000001.'},
{t:'bin',s:'Binary lab',q:'Build the number 10.',n:10,e:'8 + 2 = 10, so 00001010.'},
{t:'bin',s:'Binary lab',q:'Build 97. Lowercase letters are different numbers.',n:97,e:'64 + 32 + 1 = 97. That is the letter a.'},
{t:'mc',s:'Binary',q:'How many bits are in one byte?',o:['4','8','16','256'],a:1,e:'1 byte = 8 bits. It can show 256 different values (0 to 255).'},
{t:'mc',s:'Binary',q:'What does ord("A") return?',o:['"A"','1000001','65','97'],a:2,e:'ord() gives the number behind a character. A is 65.'},
{t:'mc',s:'Binary',q:'Why can ASCII not store Somali or Arabic letters?',o:['It only covers 128 characters','It is too slow','It is only for numbers','Python blocks it'],a:0,e:'ASCII has 128 characters. Unicode covers almost every writing system.'},
{t:'mc',s:'Binary',q:'What does "5" + "5" give in Python?',o:['10','"55"','Error','"10"'],a:1,e:'Both are strings (encoded text), so Python joins them: "55".'},
{t:'order',s:'Code to execution',q:'Tap the steps in the right order, first to last.',o:['Source code (.py file)','Bytecode','PVM runs the bytecode','Machine code runs on the CPU'],e:'Source, then bytecode, then PVM, then machine code on the CPU.'},
{t:'mc',s:'Code to execution',q:'What does the Python Virtual Machine (PVM) do?',o:['Writes your code','Executes the bytecode','Draws the screen','Stores your files'],a:1,e:'The PVM carries out your program by executing bytecode.'},
{t:'tf',s:'Code to execution',q:'Python is compiled to machine code before it runs, just like C.',a:false,e:'Python is interpreted: it becomes bytecode and the PVM runs it. C is compiled ahead of time.'},
{t:'mc',s:'Code to execution',q:'Where does Python cache bytecode as .pyc files?',o:['__main__','__pycache__','/bin','dis'],a:1,e:'The __pycache__ folder keeps .pyc files so unchanged code is not translated again.'},
{t:'mc',s:'Memory',code:'a = [1, 2, 3]\nb = a\nb.append(4)\nprint(a)',q:'What does this print?',o:['[1, 2, 3]','[1, 2, 3, 4]','[4]','Error'],a:1,e:'a and b point to the SAME list object, so changing it through b changes a too.'},
{t:'mc',s:'Memory',code:'x = 10\ny = x\ny = y + 5\nprint(x, y)',q:'What does this print?',o:['15 15','10 10','10 15','15 10'],a:2,e:'Numbers are immutable. y = y + 5 makes a new object. x stays 10.'},
{t:'mc',s:'Memory',code:'a = [1, 2, 3]\nc = [1, 2, 3]\nprint(a == c, a is c)',q:'What does this print?',o:['True True','True False','False True','False False'],a:1,e:'== compares values (equal). "is" checks if it is the exact same object (it is not).'},
{t:'sort',s:'Memory',q:'Is each type mutable or immutable?',c:['Mutable','Immutable'],i:[['list',0],['str',1],['tuple',1],['dict',0],['int',1],['set',0]],e:'list, dict and set can change in place. int, str and tuple cannot.'},
{t:'sort',s:'Operating system',q:'Does each one describe a process or a thread?',c:['Process','Thread'],i:[['A running instance of a program',0],['A smaller unit of work inside a process',1],['Has its own private memory',0],['Shares memory with others in the same process',1]],e:'Processes are isolated. Threads inside one process share memory.'},
{t:'order',s:'Operating system',q:'You run python app.py. Tap what happens, first to last.',o:['The OS creates a new process','Your file is loaded from storage into RAM','The CPU executes the instructions','Output is shown on the screen'],e:'OS creates the process, loads the file into RAM, the CPU executes, then output appears.'},
{t:'mc',s:'Operating system',q:'What does the GIL do in CPython?',o:['Lets many threads run bytecode at once','Lets only one thread run bytecode at a time','Deletes unused files','Speeds up the SSD'],a:1,e:'The Global Interpreter Lock allows one thread to run Python bytecode at a time.'}
];
const app=document.getElementById('app');
let name='',i=0,score=0,res=[],st={};
const norm=s=>s.trim().toLowerCase().replace(/[^a-z0-9]/g,'');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};

function start(){
  app.innerHTML=`<h1>Lesson 1 Lab: How Computers Actually Work</h1>
  <p>${Q.length} hands-on challenges: build binary numbers, order the steps from code to CPU, predict Python output, and sort concepts. You see the answer straight away.</p>
  <div class="card"><label for="nm"><b>Your full name</b></label><div class="row"><input id="nm" type="text" autocomplete="name" placeholder="Type your name"></div>
  <button class="btn" id="go">Start lab</button><p id="err" style="color:var(--bad);margin:6px 0 0"></p></div>`;
  document.getElementById('go').onclick=()=>{
    const v=document.getElementById('nm').value.trim();
    if(!v){document.getElementById('err').textContent='Please type your name first.';return}
    name=v;i=0;score=0;res=[];show();
  };
}
function show(){
  const q=Q[i];st={};
  app.innerHTML=`<div class="meta"><span>Challenge ${i+1} of ${Q.length}</span><span>Score: ${score}</span></div>
  <div class="bar"><i style="width:${i/Q.length*100}%"></i></div>
  <div class="card"><div class="tag">${q.s}</div><div class="q">${esc(q.q)}</div>${q.code?`<pre>${esc(q.code)}</pre>`:''}<div id="body"></div><div id="fb"></div></div>`;
  const b=document.getElementById('body');
  if(q.t==='mc'||q.t==='tf'){
    const o=q.t==='tf'?['True','False']:q.o,a=q.t==='tf'?(q.a?0:1):q.a;
    b.innerHTML=o.map((x,k)=>`<button class="opt" data-k="${k}">${esc(x)}</button>`).join('');
    b.querySelectorAll('.opt').forEach(x=>x.onclick=()=>{
      b.querySelectorAll('button').forEach(y=>y.disabled=true);
      const r=+x.dataset.k===a;x.classList.add(r?'ok':'no');
      if(!r)b.querySelector(`[data-k="${a}"]`).classList.add('ok');
      finish(r,null);
    });
  }else if(q.t==='bin'){
    st.bits=[0,0,0,0,0,0,0,0];
    b.innerHTML=`<div class="bits">${[128,64,32,16,8,4,2,1].map(v=>`<div>${v}</div>`).join('')}${st.bits.map((_,k)=>`<button class="opt" data-k="${k}">0</button>`).join('')}</div><div class="read" id="rd"></div><button class="btn" id="ck">Check</button>`;
    const upd=()=>{
      const n=st.bits.reduce((s,v,k)=>s+v*[128,64,32,16,8,4,2,1][k],0);st.n=n;
      document.getElementById('rd').textContent=`${st.bits.join('')} = ${n}`+(n>=32&&n<=126?`  ("${String.fromCharCode(n)}")`:'');
      b.querySelectorAll('.bits button').forEach((x,k)=>{x.textContent=st.bits[k];x.classList.toggle('on',!!st.bits[k])});
    };
    upd();
    b.querySelectorAll('.bits button').forEach(x=>x.onclick=()=>{st.bits[+x.dataset.k]^=1;upd()});
    document.getElementById('ck').onclick=()=>{
      b.querySelectorAll('button').forEach(y=>y.disabled=true);
      finish(st.n===q.n,String(q.n));
    };
  }else if(q.t==='tap'){}
  else if(q.t==='order'){
    st.seq=[];st.ord=shuf(q.o.map((_,k)=>k));
    const draw=()=>{
      b.innerHTML=st.ord.map(k=>{const p=st.seq.indexOf(k);return `<button class="opt" data-k="${k}">${p>=0?`<span class="num">${p+1}</span>`:''}${esc(q.o[k])}</button>`}).join('')+`<div class="row"><button class="opt btn alt" id="rs">Start over</button><button class="btn" id="ck" style="flex:1;margin:0">Check order</button></div>`;
      b.querySelectorAll('.opt[data-k]').forEach(x=>x.onclick=()=>{const k=+x.dataset.k;if(!st.seq.includes(k))st.seq.push(k);draw()});
      document.getElementById('rs').onclick=()=>{st.seq=[];draw()};
      document.getElementById('ck').onclick=()=>{
        if(st.seq.length<q.o.length){document.getElementById('fb').innerHTML='<div class="fb no">Tap every step first.</div>';return}
        const r=st.seq.every((k,p)=>k===p);
        b.querySelectorAll('button').forEach(y=>y.disabled=true);
        b.insertAdjacentHTML('beforeend',`<p style="margin:8px 0 0"><b>Correct order:</b><br>${q.o.map((x,p)=>`${p+1}. ${esc(x)}`).join('<br>')}</p>`);
        finish(r,null);
      };
    };
    draw();
  }else if(q.t==='sort'){
    b.innerHTML=q.i.map((it,k)=>`<div class="row" data-k="${k}"><span>${esc(it[0])}</span>${q.c.map((c,j)=>`<button class="opt" data-j="${j}">${c}</button>`).join('')}</div>`).join('')+`<button class="btn" id="ck" style="margin-top:10px">Check answers</button>`;
    b.querySelectorAll('.row').forEach(r=>r.querySelectorAll('button').forEach(x=>x.onclick=()=>{
      st[r.dataset.k]=+x.dataset.j;r.querySelectorAll('button').forEach(y=>y.classList.remove('ok'));x.classList.add('ok');
    }));
    document.getElementById('ck').onclick=()=>{
      if(Object.keys(st).length<q.i.length){document.getElementById('fb').innerHTML='<div class="fb no">Choose an answer for every item first.</div>';return}
      let all=true;
      b.querySelectorAll('.row').forEach(r=>{
        const k=+r.dataset.k,right=st[k]===q.i[k][1];if(!right)all=false;
        r.querySelectorAll('button').forEach(y=>{y.disabled=true;y.classList.remove('ok');
          if(+y.dataset.j===q.i[k][1])y.classList.add('ok');else if(+y.dataset.j===st[k])y.classList.add('no')});
      });
      document.getElementById('ck').disabled=true;
      finish(all,null);
    };
  }
}
function finish(right,ans){
  const q=Q[i];
  if(right)score++;
  res.push({q:q.q,s:q.s,right});
  const last=i===Q.length-1;
  document.getElementById('fb').innerHTML=`<div class="fb ${right?'ok':'no'}"><b>${right?'Correct!':'Not quite.'}</b>${!right&&ans?' Answer: '+esc(ans)+'.':''} ${esc(q.e)}</div><button class="btn" id="nx" style="margin-top:12px">${last?'See my result':'Next challenge'}</button>`;
  const nx=document.getElementById('nx');
  nx.onclick=()=>{i++;last?result():show()};
  nx.focus();
}
function result(){
  const p=Math.round(score/Q.length*100);
  const msg=p>=80?'Excellent. You understand how computers work!':p>=50?'Good job. You passed. Review the topics below.':'Re-read the lesson notes and try again.';
  const text=`${name} scored ${score}/${Q.length} (${p}%) in the Lesson 1 Lab: How Computers Actually Work.`;
  const miss=res.filter(r=>!r.right),topics=[...new Set(miss.map(r=>r.s))];
  app.innerHTML=`<div class="card" style="text-align:center"><div class="tag">Result for ${esc(name)}</div><div class="big">${score}/${Q.length}</div><p><b>${p}%</b>. ${msg}</p>
  <a class="btn" style="display:block" href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">Send my score on WhatsApp</a>
  <button class="opt btn alt" id="again" style="text-align:center;margin-top:10px">Try again</button></div>
  ${miss.length?`<div class="card"><b>Topics to revise: ${topics.map(esc).join(', ')}</b>${miss.map(m=>`<div class="miss">${esc(m.q)}</div>`).join('')}</div>`:'<div class="card">You got every challenge right!</div>'}`;
  document.getElementById('again').onclick=()=>{i=0;score=0;res=[];show()};
}
start();
</script>
</body>
</html>
